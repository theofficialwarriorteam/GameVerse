name = "gameverse-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Firebase project + the one administrator allowed to call /v1/admin/* endpoints.
FIREBASE_PROJECT_ID = "gameverse-5f25c"
ADMIN_EMAIL = "aanjorajeev@gmail.com"
# Comma-separated list of the website origins allowed to call this API (no trailing slash).
ALLOWED_ORIGINS = "https://YOUR-SITE.workers.dev,http://localhost:5173"
# "Today's visitors" and daily/weekly task resets use this time zone (IANA name).
STATS_TIMEZONE = "Asia/Kolkata"

[[d1_databases]]
binding = "DB"
database_name = "gameverse"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"


# Secrets (never put these in this file or in frontend code):
#   npx wrangler secret put TOKEN_SECRET          (required; signs download links, hashes IPs)
#   npx wrangler secret put ADS_POSTBACK_SECRET   (only for rewarded ads)
